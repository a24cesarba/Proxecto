version: "3.8"


networks:
  monitoring:
    external: true

configs:
  prometheus_cfg:
    external: true
  alertmanager_cfg:
    external: true
  alert_rules_cfg:
    external: true

volumes:
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local

services:

  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    networks:
      - monitoring
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      SERVICES: 1     
      TASKS:    1     
      NETWORKS: 1     
      NODES:    1     

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
      restart_policy:
        condition: on-failure

  # ── cAdvisor ─────────────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    networks:
      - monitoring
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.swarm.service.name,com.docker.swarm.node.id"
    deploy:
      mode: global
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 2
        delay: 10s
        order: start-first

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    networks:
      - monitoring
    volumes:
      - prometheus_data:/prometheus
    configs:
      - source: prometheus_cfg
        target: /etc/prometheus/prometheus.yml
        mode: 0444
      - source: alert_rules_cfg
        target: /etc/prometheus/alert.rules.yml
        mode: 0444
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # ── Alertmanager ─────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    networks:
      - monitoring
    volumes:
      - alertmanager_data:/alertmanager
    configs:
      - source: alertmanager_cfg
        target: /etc/alertmanager/alertmanager.yml
        mode: 0444
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - target: 9093
        published: 9093
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s

  # ── Autoscaler webhook ────────────────────────────────────────────────────
  # Servidor Flask que recibe webhooks de Alertmanager y escala app_web.
  autoscaler:
    image: a24cesarba/swarm-autoscaler:1.0
    networks:
      - monitoring
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AUTOSCALE_SERVICE:    "app_web"
      AUTOSCALE_MIN:        "3"
      AUTOSCALE_MAX:        "9"
      SCALE_UP_BY:          "1"
      SCALE_DOWN_BY:        "1"
      SCALE_UP_COOLDOWN:    "120"
      SCALE_DOWN_COOLDOWN:  "300"
      LOG_LEVEL:            "INFO"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s