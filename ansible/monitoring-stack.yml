version: "3.8"

# =============================================================================
# Stack de monitorización y autoescalado
# Desplegarlo DESPUÉS del stack principal 'app':
#   docker stack deploy -c monitoring-stack.yml monitoring
#
# Componentes:
#   cadvisor    — métricas de contenedores (global: un pod por nodo)
#   prometheus  — scraping + evaluación de reglas de alerta
#   alertmanager — routing de alertas → webhook autoscaler
#   autoscaler  — webhook receiver que llama a la Docker API para escalar
# =============================================================================

networks:
  # Red compartida con el stack 'app' para que Prometheus pueda scrape Traefik
  # Debe crearse externamente: docker network create --driver overlay monitoring
  monitoring:
    external: true

configs:
  prometheus_cfg:
    external: true     # creado en desplegar.yml con el fichero prometheus.yml
  alertmanager_cfg:
    external: true     # creado con alertmanager.yml
  alert_rules_cfg:
    external: true     # creado con alert.rules.yml

volumes:
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local

services:

  # ── cAdvisor ─────────────────────────────────────────────────────────────
  # Expone métricas de cada contenedor en :8080/metrics.
  # Mode global: se ejecuta en TODOS los nodos del clúster.
  # Necesita privilegios y acceso a los cgroups y socket de Docker.
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    networks:
      - monitoring
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - "--housekeeping_interval=30s"     # reduce CPU overhead
      - "--docker_only=true"              # solo contenedores Docker
      - "--store_container_labels=false"  # reduce cardinalidad de métricas
      - "--whitelisted_container_labels=com.docker.swarm.service.name,com.docker.swarm.node.id"
    deploy:
      mode: global     # un pod por CADA nodo
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 2
        delay: 10s
        order: start-first

  # ── Prometheus ────────────────────────────────────────────────────────────
  # Scrape cAdvisor en todos los nodos via dockerswarm_sd.
  # Evalúa reglas de alerta (alert.rules.yml) y envía disparos a Alertmanager.
  # Solo en nodos manager para acceso al Docker socket.
  prometheus:
    image: prom/prometheus:v2.51.2
    networks:
      - monitoring
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - prometheus_data:/prometheus
    configs:
      - source: prometheus_cfg
        target: /etc/prometheus/prometheus.yml
        mode: 0444
      - source: alert_rules_cfg
        target: /etc/prometheus/alert.rules.yml
        mode: 0444
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"            # permite reload sin reiniciar
      - "--web.enable-admin-api"
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # ── Alertmanager ─────────────────────────────────────────────────────────
  # Recibe alertas de Prometheus, las agrupa y las enruta al webhook autoscaler.
  alertmanager:
    image: prom/alertmanager:v0.27.0
    networks:
      - monitoring
    volumes:
      - alertmanager_data:/alertmanager
    configs:
      - source: alertmanager_cfg
        target: /etc/alertmanager/alertmanager.yml
        mode: 0444
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
      - "--cluster.advertise-address=0.0.0.0:9094"
    ports:
      - target: 9093
        published: 9093
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s

  # ── Autoscaler webhook ────────────────────────────────────────────────────
  # Servidor Flask que recibe webhooks de Alertmanager.
  # Llama a la Docker API via socket para escalar el servicio 'app_web'.
  # Solo en managers para acceso al Docker socket y permiso de scale.
  autoscaler:
    image: a24cesarba/swarm-autoscaler:1.0   # construir con Dockerfile.autoscaler
    networks:
      - monitoring
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      AUTOSCALE_SERVICE: "app_web"     # nombre exacto: <stack>_<servicio>
      AUTOSCALE_MIN: "3"
      AUTOSCALE_MAX: "9"
      SCALE_UP_BY: "1"
      SCALE_DOWN_BY: "1"
      SCALE_UP_COOLDOWN: "120"         # segundos entre scale-up consecutivos
      SCALE_DOWN_COOLDOWN: "300"       # segundos entre scale-down consecutivos
      LOG_LEVEL: "INFO"
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s
