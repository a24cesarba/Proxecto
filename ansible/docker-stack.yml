version: "3.8"

networks:
  swarm_net:
    driver: overlay
    attachable: true
    driver_opts:
      encrypted: "true"
 
  # Estas redes ahora son macvlan creadas previamente usando ansible
  frontend:
    external: true
 
  web_lb:
    external: true
 
  backend:
    external: true
 
# ---------------------------------------------------------------------------
# Secrets
# ---------------------------------------------------------------------------
secrets:
  db_root_password:
    external: true
  db_galera_password:
    external: true
 
# ---------------------------------------------------------------------------
# Configs
# ---------------------------------------------------------------------------
configs:
  haproxy_cfg:
    external: true
 
# ---------------------------------------------------------------------------
# Services
# ---------------------------------------------------------------------------
services:
  web:
    image: httpd:2.4
    networks:
      - swarm_net
      - frontend
      - web_lb
    volumes:
      - type: bind
        source: /mnt/almacenamiento_compartido   # GlusterFS mount — Ansible playbook path
        target: /var/www/html/uploads
        read_only: false
    deploy:
      mode: replicated
      replicas: 3
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 192M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first      # new task healthy before old is removed
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - "autoscale.enabled=true"
        - "autoscale.min=3"
        - "autoscale.max=9"
        - "autoscale.metric=cpu"
  lb:
    image: haproxy:2.8-alpine
    networks:
      - swarm_net
      - web_lb
      - backend
    configs:
      - source: haproxy_cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.role == lb
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s
  db:
    image: a24cesarba/galera-mariadb:10.11   # built from galera-image/Dockerfile
    hostname: "{{.Node.Hostname}}"
    networks:
      - swarm_net
      - backend
    secrets:
      - db_root_password
      - db_galera_password
    environment:
      MYSQL_ROOT_PASSWORD_FILE:   /run/secrets/db_root_password
      GALERA_SST_PASSWORD_FILE:   /run/secrets/db_galera_password
      GALERA_CLUSTER_NAME:        galera_cluster
      GALERA_CLUSTER_ADDRESS:     gcomm://app_db
      GALERA_CLUSTER_SERVICE:     app_db
      GALERA_BOOTSTRAP_NODE:      db1
      GALERA_SST_USER:            galera_sst
    volumes:
      - db_data:/var/lib/mysql   # local per-node; Galera replicates state
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.role == db
      endpoint_mode: dnsrr
      resources:
        limits:
          memory: 2000M
        reservations:
          memory: 1024M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 180s
      update_config:
        parallelism: 1          # one node at a time — never lose quorum
        delay: 30s              # allow IST/SST to complete before next node
        failure_action: rollback
        order: stop-first       # stop old before starting new — protects quorum
      rollback_config:
        parallelism: 1
        delay: 30s
        order: stop-first
volumes:
  db_data:
    driver: local
