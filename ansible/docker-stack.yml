version: "3.8"

networks:
  proxy_web:
    driver: overlay
    attachable: false
    driver_opts:
      encrypted: "true"

  app_db:
    driver: overlay
    attachable: false
    driver_opts:
      encrypted: "true"

  db_net:
    driver: overlay
    attachable: false
    driver_opts:
      encrypted: "true"

secrets:
  db_root_password:
    external: true
  db_galera_password:
    external: true
  # Certificados mTLS para que Traefik autentique la Docker API
  docker_client_ca:
    external: true
  docker_client_cert:
    external: true
  docker_client_key:
    external: true

configs:
  haproxy_cfg:
    external: true
  traefik_cfg:
    external: true

volumes:
  db_data:
    driver: local

services:

  # ── Traefik (reverse proxy HTTP/HTTPS) ───────────────────────────────────
  # Colocado en los nodos traefik1/traefik2 (role=traefik).
  # Sin socket mount: accede a la Docker API via TCP+mTLS usando los secrets.
  # Publica los puertos 80/443 en modo host (IP real del cliente preservada).
  traefik:
    image: traefik:v3.0
    networks:
      - proxy_web
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 8080
        published: 8081
        protocol: tcp
        mode: ingress
    configs:
      - source: traefik_cfg
        target: /etc/traefik/traefik.yml
        mode: 0444
    secrets:
      - docker_client_ca
      - docker_client_cert
      - docker_client_key
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.role == traefik   # exclusivo en traefik1/traefik2
        preferences:
          - spread: node.id
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      labels:
        - "traefik.enable=false"

  # ── Apache httpd ──────────────────────────────────────────────────────────
  # Sin puertos publicados en el host. Solo accesible via proxy_web overlay.
  web:
    image: httpd:2.4
    networks:
      - proxy_web
      - app_db
    volumes:
      - type: bind
        source: /mnt/almacenamiento_compartido
        target: /var/www/html/uploads
        read_only: false
    deploy:
      mode: replicated
      replicas: 3
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 192M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=app_proxy_web"
        - "traefik.http.routers.web.rule=PathPrefix(`/`)"
        - "traefik.http.routers.web.entrypoints=web"
        - "traefik.http.services.web.loadbalancer.server.port=80"
        - "traefik.http.services.web.loadbalancer.healthcheck.path=/server-status"
        - "traefik.http.services.web.loadbalancer.healthcheck.interval=10s"
        - "traefik.http.services.web.loadbalancer.healthcheck.timeout=3s"
        - "autoscale.service=app_web"
        - "autoscale.min=3"
        - "autoscale.max=9"

  # ── HAProxy (balanceador MySQL L4) ────────────────────────────────────────
  lb:
    image: haproxy:2.8-alpine
    networks:
      - app_db
      - db_net
    configs:
      - source: haproxy_cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.role == lb
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s

  # ── Galera / MariaDB ──────────────────────────────────────────────────────
  db:
    image: a24cesarba/galera-mariadb:10.11
    hostname: "{{.Node.Hostname}}"
    networks:
      - db_net
    secrets:
      - db_root_password
      - db_galera_password
    environment:
      MYSQL_ROOT_PASSWORD_FILE:   /run/secrets/db_root_password
      GALERA_SST_PASSWORD_FILE:   /run/secrets/db_galera_password
      GALERA_CLUSTER_NAME:        galera_cluster
      GALERA_CLUSTER_ADDRESS:     gcomm://app_db
      GALERA_CLUSTER_SERVICE:     app_db
      GALERA_BOOTSTRAP_NODE:      db1
      GALERA_SST_USER:            galera_sst
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.role == db
      endpoint_mode: dnsrr
      resources:
        limits:
          memory: 2000M
        reservations:
          memory: 1024M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 5
        window: 180s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 30s
        order: stop-first
