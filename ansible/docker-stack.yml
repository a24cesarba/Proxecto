version: "3.8"

networks:
  proxy_web:
    driver: overlay
    attachable: false
    ipam:
      config:
        - subnet: 172.28.1.0/24

  app_db:
    driver: overlay
    attachable: false
    ipam:
      config:
        - subnet: 172.28.2.0/24

  db_net:
    driver: overlay
    attachable: false
    ipam:
      config:
        - subnet: 172.28.3.0/24
      
  monitoring:
    driver: overlay
    ipam:
      config:
        - subnet: 172.28.4.0/24

secrets:
  db_root_password:
    external: true
  db_galera_password:
    external: true
  db_app_password:
    external: true
  docker_client_ca:
    external: true
  docker_client_cert:
    external: true
  docker_client_key:
    external: true
  db_superuser_hash:
    external: true

configs:
  haproxy_cfg:
    external: true
  traefik_cfg:
    external: true
  prometheus_cfg:
    external: true
  alertmanager_cfg:
    external: true
  alert_rules_cfg:
    external: true

volumes:
  db_data:
    driver: local
  prometheus_data:
    driver: local
  alertmanager_data:
    driver: local

services:

  # ── Traefik ───────────────────────────────────────────────────────────────
  traefik:
    image: traefik:v3.0
    networks:
      - proxy_web
      - monitoring
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
      - target: 8080
        published: 8081
        protocol: tcp
        mode: ingress
    configs:
      - source: traefik_cfg
        target: /etc/traefik/traefik.yml
        mode: 0444
    secrets:
      - docker_client_ca
      - docker_client_cert
      - docker_client_key
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.role == traefik
        preferences:
          - spread: node.id
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first

  # ── Servicio web ──────────────────────────────────────────
  web:
    image: a24cesarba/app-web:latest
    networks:
      - proxy_web 
      - app_db 
    secrets:
      - db_app_password  
    environment:
      # Conexión a MariaDB Galera a través de HAProxy
      DB_HOST: "lb"
      DB_PORT: "3306"
      DB_NAME: "app"
      DB_USER: "app"
      UPLOAD_DIR: "/app/almacenamiento"
    volumes:
      - type: bind
        source: /mnt/almacenamiento_compartido/
        target: /app/almacenamiento
        read_only: false
    deploy:
      mode: replicated
      replicas: 3
      placement:
        constraints:
          - node.role == manager       
      resources:
        limits:
          cpus: '1.0'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 192M
      restart_policy:
        condition: any
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 15s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 10s
        order: start-first
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=app_proxy_web"
        - "traefik.http.routers.web.rule=PathPrefix(`/`)"
        - "traefik.http.routers.web.entrypoints=web"
        - "traefik.http.services.web.loadbalancer.server.port=80"
        - "traefik.http.services.web.loadbalancer.healthcheck.path=/healthz.php"
        - "traefik.http.services.web.loadbalancer.healthcheck.interval=10s"
        - "traefik.http.services.web.loadbalancer.healthcheck.timeout=3s"
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost/"]
    #   interval: 15s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 20s

  # ── HAProxy (balanceador MySQL L4) ────────────────────────────────────────
  lb:
    image: haproxy:2.8-alpine
    networks:
      - app_db
      - db_net
    configs:
      - source: haproxy_cfg
        target: /usr/local/etc/haproxy/haproxy.cfg
        mode: 0444
    deploy:
      mode: replicated
      replicas: 2
      placement:
        constraints:
          - node.labels.role == lb
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 60s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      rollback_config:
        parallelism: 1
        delay: 5s

  # ── Galera / MariaDB ──────────────────────────────────────────────────────
  db:
    image: a24cesarba/galera-mariadb:10.11
    hostname: "{{.Node.Hostname}}"
    networks:
      - db_net
    secrets:
      - db_root_password
      - db_galera_password
      - db_app_password
      - db_superuser_hash
    environment:
      MYSQL_ROOT_PASSWORD_FILE:   /run/secrets/db_root_password
      GALERA_SST_PASSWORD_FILE:   /run/secrets/db_galera_password
      APP_DB_PASSWORD_FILE:       /run/secrets/db_app_password  
      APP_DB_NAME:                app                           
      APP_DB_USER:                app                            
      GALERA_CLUSTER_NAME:        galera_cluster
      GALERA_CLUSTER_ADDRESS:     gcomm://tasks.app_db
      # GALERA_CLUSTER_SERVICE:     app_db
      GALERA_BOOTSTRAP_NODE:      db1
      GALERA_SST_USER:            galera_sst
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      mode: global
      placement:
        constraints:
          - node.labels.role == db
      endpoint_mode: dnsrr
      resources:
        limits:
          memory: 2000M
        reservations:
          memory: 1024M
      restart_policy:
        condition: on-failure
        delay: 60s
        max_attempts: 5
        window: 180s
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 30s
        order: stop-first
        
#---------------------------------------------------------------------
#-------------------- Servicios de monitorización --------------------
#---------------------------------------------------------------------

  socket-proxy:
    image: tecnativa/docker-socket-proxy:0.3.0
    networks:
      - monitoring
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      SERVICES:   1     
      TASKS:      1     
      NETWORKS:   1     
      NODES:      1     
      CONTAINERS: 1

    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 16M
      restart_policy:
        condition: on-failure

  # ── cAdvisor ─────────────────────────────────────────────────────────────
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    networks:
      - monitoring
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    command:
      - "--housekeeping_interval=30s"
      - "--docker_only=true"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.swarm.service.name,com.docker.swarm.node.id"
    deploy:
      mode: global
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M
      restart_policy:
        condition: on-failure
        delay: 5s
      update_config:
        parallelism: 2
        delay: 10s
        order: start-first

  # ── Prometheus ────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.2
    networks:
      - monitoring
    volumes:
      - prometheus_data:/prometheus
    configs:
      - source: prometheus_cfg
        target: /etc/prometheus/prometheus.yml
        mode: 0444
      - source: alert_rules_cfg
        target: /etc/prometheus/alert.rules.yml
        mode: 0444
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
      - "--web.enable-admin-api"
    ports:
      - target: 9090
        published: 9090
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 10s
        max_attempts: 3

  # ── Alertmanager ─────────────────────────────────────────────────────────
  alertmanager:
    image: prom/alertmanager:v0.27.0
    networks:
      - monitoring
    volumes:
      - alertmanager_data:/alertmanager
    configs:
      - source: alertmanager_cfg
        target: /etc/alertmanager/alertmanager.yml
        mode: 0444
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - target: 9093
        published: 9093
        protocol: tcp
        mode: ingress
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s

  # ── Autoscaler webhook ────────────────────────────────────────────────────
  autoscaler:
    image: a24cesarba/swarm-autoscaler:1.0
    networks:
      - monitoring
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    deploy:
      mode: replicated
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 32M
      restart_policy:
        condition: on-failure
        delay: 5s