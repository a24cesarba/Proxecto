---
# =============================================================================
# iptables.yml — Configuración de cortafuegos para el clúster
# =============================================================================


# ─────────────────────────────────────────────────────────────────────────────
# PLAY 1 — Reset a estado limpio y seguro en TODOS los nodos
# Las políticas quedan en ACCEPT antes y después del flush.
# ─────────────────────────────────────────────────────────────────────────────
- name: Reset iptables — estado limpio en todos los nodos
  hosts: all
  become: yes
  tasks:

    - name: Política ACCEPT en INPUT, FORWARD y OUTPUT
      ansible.builtin.iptables:
        chain: "{{ item }}"
        policy: ACCEPT
      loop:
        - INPUT
        - FORWARD
        - OUTPUT

    - name: Vaciar cadena INPUT
      ansible.builtin.iptables:
        chain: INPUT
        flush: yes

    - name: Vaciar cadena FORWARD
      ansible.builtin.iptables:
        chain: FORWARD
        flush: yes

    - name: Vaciar cadena OUTPUT
      ansible.builtin.iptables:
        chain: OUTPUT
        flush: yes

    - name: Vaciar cadena DOCKER-USER (si ya existe)
      ansible.builtin.command: iptables -F DOCKER-USER
      changed_when: true
      failed_when: false


# ─────────────────────────────────────────────────────────────────────────────
# PLAY 2 — Reglas ACCEPT en INPUT comunes a TODOS los nodos
# ─────────────────────────────────────────────────────────────────────────────
- name: Reglas INPUT base (todos los nodos)
  hosts: all
  become: yes
  tasks:

    - name: INPUT ACCEPT — loopback
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT
        comment: loopback

    - name: INPUT ACCEPT — ESTABLISHED y RELATED
      ansible.builtin.iptables:
        chain: INPUT
        ctstate:
          - ESTABLISHED
          - RELATED
        jump: ACCEPT
        comment: established-related

    - name: INPUT ACCEPT — ICMP echo-request redes internas (10/s)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: icmp
        icmp_type: echo-request
        source: 10.0.0.0/8
        match: limit
        limit: 10/sec
        jump: ACCEPT
        comment: icmp-internal

    - name: INPUT ACCEPT — ICMP echo-request NAT Vagrant (10/s)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: icmp
        icmp_type: echo-request
        source: 10.0.2.0/24
        match: limit
        limit: 10/sec
        jump: ACCEPT
        comment: icmp-vagrant-nat

    - name: INPUT ACCEPT — SSH desde NAT Vagrant (eth0)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "22"
        source: 10.0.2.0/24
        jump: ACCEPT
        comment: ssh-vagrant-nat

    - name: INPUT ACCEPT — SSH desde red de gestión (eth1)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "22"
        source: 10.0.0.0/24
        jump: ACCEPT
        comment: ssh-mgmt

    - name: INPUT ACCEPT — SSH desde red host-only (eth3)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "22"
        source: 192.168.56.0/24
        jump: ACCEPT
        comment: ssh-hostonly

    - name: INPUT ACCEPT — Swarm gossip TCP 7946
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "7946"
        source: 10.0.0.0/24
        jump: ACCEPT
        comment: swarm-gossip-tcp

    - name: INPUT ACCEPT — Swarm gossip UDP 7946
      ansible.builtin.iptables:
        chain: INPUT
        protocol: udp
        destination_port: "7946"
        source: 10.0.0.0/24
        jump: ACCEPT
        comment: swarm-gossip-udp

    - name: INPUT ACCEPT — VXLAN overlay UDP 4789 (eth2)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: udp
        destination_port: "4789"
        source: 10.10.0.0/24
        jump: ACCEPT
        comment: vxlan-overlay


# ─────────────────────────────────────────────────────────────────────────────
# PLAY 3 — Reglas INPUT adicionales para nodos MANAGER (web1, web2, web3)
# ─────────────────────────────────────────────────────────────────────────────
- name: Reglas INPUT para managers
  hosts: managers
  become: yes
  tasks:

    - name: INPUT ACCEPT — Swarm join TCP 2377
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "2377"
        source: 10.0.0.0/24
        jump: ACCEPT
        comment: swarm-join

    - name: INPUT ACCEPT — Docker API TLS TCP 2376 desde Traefik (10.0.0.40/30)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "2376"
        source: 10.0.0.40/30
        jump: ACCEPT
        comment: docker-api-tls-traefik

    - name: INPUT ACCEPT — GlusterFS glusterd TCP 24007 desde web1
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "24007"
        source: 10.100.0.11/32
        jump: ACCEPT
        comment: gluster-glusterd-web1

    - name: INPUT ACCEPT — GlusterFS glusterd TCP 24007 desde web2
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "24007"
        source: 10.100.0.12/32
        jump: ACCEPT
        comment: gluster-glusterd-web2

    - name: INPUT ACCEPT — GlusterFS glusterd TCP 24007 desde web3
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "24007"
        source: 10.100.0.13/32
        jump: ACCEPT
        comment: gluster-glusterd-web3

    - name: INPUT ACCEPT — GlusterFS bricks TCP 49152:49160 desde web1
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "49152:49160"
        source: 10.100.0.11/32
        jump: ACCEPT
        comment: gluster-brick-web1

    - name: INPUT ACCEPT — GlusterFS bricks TCP 49152:49160 desde web2
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "49152:49160"
        source: 10.0.0.12/32
        jump: ACCEPT
        comment: gluster-brick-web2

    - name: INPUT ACCEPT — GlusterFS bricks TCP 49152:49160 desde web3
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "49152:49160"
        source: 10.100.0.13/32
        jump: ACCEPT
        comment: gluster-brick-web3


# ─────────────────────────────────────────────────────────────────────────────
# PLAY 4 — Reglas INPUT para nodos TRAEFIK
# ─────────────────────────────────────────────────────────────────────────────
- name: Reglas INPUT para nodos Traefik
  hosts: traefik
  become: yes
  tasks:

    - name: INPUT ACCEPT — HTTP 80 (mode:host → llega a INPUT)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "80"
        jump: ACCEPT
        comment: http-public

    - name: INPUT ACCEPT — HTTPS 443 (mode:host → llega a INPUT)
      ansible.builtin.iptables:
        chain: INPUT
        protocol: tcp
        destination_port: "443"
        jump: ACCEPT
        comment: https-public

    - name: ACCEPT ICMP echo-request público con rate limit
      ansible.builtin.iptables:
        chain: INPUT
        protocol: icmp
        icmp_type: echo-request
        match: limit
        limit: "5/sec"
        jump: ACCEPT
        comment: "icmp-public"

 # ─────────────────────────────────────────────────────────────────────────────
 # PLAY 5 — Reglas OUTPUT (todos los nodos)
 # ─────────────────────────────────────────────────────────────────────────────
- name: Reglas OUTPUT base (todos los nodos)
  hosts: all
  become: yes
  tasks:

    - name: OUTPUT ACCEPT — loopback
      ansible.builtin.iptables:
        chain: OUTPUT
        out_interface: lo
        jump: ACCEPT
        comment: out-loopback

    - name: OUTPUT ACCEPT — ESTABLISHED y RELATED
      ansible.builtin.iptables:
        chain: OUTPUT
        ctstate:
          - ESTABLISHED
          - RELATED
        jump: ACCEPT
        comment: out-established-related

    - name: OUTPUT ACCEPT — ICMP echo-request (10/s)
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: icmp
        icmp_type: echo-request
        match: limit
        limit: 10/sec
        jump: ACCEPT
        comment: out-icmp

    - name: OUTPUT ACCEPT — DNS UDP 53
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: udp
        destination_port: "53"
        jump: ACCEPT
        comment: out-dns-udp

    - name: OUTPUT ACCEPT — DNS TCP 53
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: "53"
        jump: ACCEPT
        comment: out-dns-tcp

    - name: OUTPUT ACCEPT — NTP UDP 123
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: udp
        destination_port: "123"
        jump: ACCEPT
        comment: out-ntp

    - name: OUTPUT ACCEPT — HTTP 80 (apt, Docker Hub)
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: "80"
        jump: ACCEPT
        comment: out-http

    - name: OUTPUT ACCEPT — HTTPS 443 (apt, Docker Hub, docker push)
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: "443"
        jump: ACCEPT
        comment: out-https

    - name: OUTPUT ACCEPT — Swarm gossip TCP 7946 → red de gestión
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: "7946"
        destination: 10.0.0.0/24
        jump: ACCEPT
        comment: out-swarm-gossip-tcp

    - name: OUTPUT ACCEPT — Swarm gossip UDP 7946 → red de gestión
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: udp
        destination_port: "7946"
        destination: 10.0.0.0/24
        jump: ACCEPT
        comment: out-swarm-gossip-udp

    - name: OUTPUT ACCEPT — Swarm raft/join TCP 2377 → red de gestión
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: "2377"
        destination: 10.0.0.0/24
        jump: ACCEPT
        comment: out-swarm-raft

    - name: OUTPUT ACCEPT — VXLAN overlay UDP 4789 → red de datos
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: udp
        destination_port: "4789"
        destination: 10.10.0.0/24
        jump: ACCEPT
        comment: out-vxlan-overlay

    - name: OUTPUT ACCEPT — redes Docker locales y overlay (172.16.0.0/12)
      ansible.builtin.iptables:
        chain: OUTPUT
        destination: 172.16.0.0/12
        jump: ACCEPT
        comment: out-docker-nets

    - name: OUTPUT ACCEPT — NAT Vagrant eth0 (10.0.2.0/24)
      ansible.builtin.iptables:
        chain: OUTPUT
        destination: 10.0.2.0/24
        jump: ACCEPT
        comment: out-vagrant-nat

# ─────────────────────────────────────────────────────────────────────────────
# PLAY 6 — Reglas OUTPUT adicionales para GlusterFS
# ─────────────────────────────────────────────────────────────────────────────
- name: Reglas OUTPUT adicionales para GlusterFS
  hosts: managers
  become: yes
  tasks:

    - name: OUTPUT ACCEPT — GlusterFS glusterd TCP 24007 → red gluster
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: "24007"
        destination: 10.100.0.0/24
        jump: ACCEPT
        comment: out-gluster-glusterd

    - name: OUTPUT ACCEPT — GlusterFS bricks TCP 49152:49160 → red gluster
      ansible.builtin.iptables:
        chain: OUTPUT
        protocol: tcp
        destination_port: "49152:49160"
        destination: 10.100.0.0/24
        jump: ACCEPT
        comment: out-gluster-bricks

# ─────────────────────────────────────────────────────────────────────────────
# PLAY 7 — Cerrar OUTPUT con NFLOG+DROP (todos los nodos)
# ─────────────────────────────────────────────────────────────────────────────
- name: Cerrar OUTPUT con NFLOG+DROP (todos los nodos)
  hosts: all
  become: yes
  tasks:

    - name: OUTPUT NFLOG — tráfico no permitido (group 2)
      ansible.builtin.command: >
        iptables -A OUTPUT
          -m comment --comment "output-nflog-drop"
          -j NFLOG --nflog-group 2 --nflog-prefix "OUTPUT-DROP: " --nflog-threshold 1
      changed_when: true

    - name: OUTPUT DROP — tráfico no permitido (catch-all)
      ansible.builtin.iptables:
        chain: OUTPUT
        jump: DROP
        comment: output-default-drop

# ─────────────────────────────────────────────────────────────────────────────
# PLAY 8 — Reglas FORWARD (todos los nodos)
# ─────────────────────────────────────────────────────────────────────────────
- name: Reglas FORWARD (todos los nodos) + NFLOG+DROP al final
  hosts: all
  become: yes
  tasks:

    - name: FORWARD ACCEPT — ESTABLISHED y RELATED
      ansible.builtin.iptables:
        chain: FORWARD
        ctstate:
          - ESTABLISHED
          - RELATED
        jump: ACCEPT
        comment: fwd-established-related

    - name: FORWARD ACCEPT — redes overlay y Docker locales (172.16.0.0/12) origen
      ansible.builtin.iptables:
        chain: FORWARD
        source: 172.16.0.0/12
        jump: ACCEPT
        comment: fwd-docker-nets-src

    - name: FORWARD ACCEPT — redes overlay y Docker locales (172.16.0.0/12) destino
      ansible.builtin.iptables:
        chain: FORWARD
        destination: 172.16.0.0/12
        jump: ACCEPT
        comment: fwd-docker-nets-dst
 
    - name: FORWARD ACCEPT — redes internas y IPAM Docker (10.0.0.0/8) origen
      ansible.builtin.iptables:
        chain: FORWARD
        source: 10.0.0.0/8
        jump: ACCEPT
        comment: fwd-internal-src
 
    - name: FORWARD ACCEPT — redes internas y IPAM Docker (10.0.0.0/8) destino
      ansible.builtin.iptables:
        chain: FORWARD
        destination: 10.0.0.0/8
        jump: ACCEPT
        comment: fwd-internal-dst

# ─────────────────────────────────────────────────────────────────────────────
# PLAY 9 — Reglas DOCKER-USER (todos los nodos) + NFLOG+DROP al final
# ─────────────────────────────────────────────────────────────────────────────
- name: Reglas DOCKER-USER (allowlist con DROP final)
  hosts: all
  become: yes
  tasks:

    - name: DOCKER-USER ACCEPT ESTABLISHED/RELATED
      ansible.builtin.command: >
        iptables -A DOCKER-USER
          -m conntrack --ctstate ESTABLISHED,RELATED
          -j ACCEPT
      changed_when: true
      failed_when: false

    - name: DOCKER-USER ACCEPT desde redes Docker internas
      ansible.builtin.command: >
        iptables -A DOCKER-USER
          -s 172.16.0.0/12
          -m comment --comment "docker-user-internal-nets"
          -j ACCEPT
      changed_when: true
      failed_when: false

    - name: DOCKER-USER ACCEPT desde red de gestión Swarm
      ansible.builtin.command: >
        iptables -A DOCKER-USER
          -s 10.0.0.0/8
          -m comment --comment "docker-user-mgmt-net"
          -j ACCEPT
      changed_when: true
      failed_when: false

    - name: DOCKER-USER ACCEPT desde red host-only VirtualBox (admin)
      ansible.builtin.command: >
        iptables -A DOCKER-USER
          -s 192.168.56.0/24
          -j ACCEPT
      changed_when: true
      failed_when: false

    - name: DOCKER-USER ACCEPT HTTP público
      ansible.builtin.command: >
        iptables -A DOCKER-USER
          -m conntrack --ctorigdstport 80
          -m comment --comment "docker-user-public-http"
          -j ACCEPT
      changed_when: true
      failed_when: false

    - name: DOCKER-USER ACCEPT HTTPS público
      ansible.builtin.command: >
        iptables -A DOCKER-USER
          -m conntrack --ctorigdstport 443
          -m comment --comment "docker-user-public-https"
          -j ACCEPT
      changed_when: true
      failed_when: false

    - name: DOCKER-USER ACCEPT puertos ingress expuestos
      ansible.builtin.command: >
        iptables -A DOCKER-USER
          -s 192.168.1.0/24
          -m conntrack --ctorigdstport {{ item }}
          -m comment --comment "docker-user-ingress-extra"
          -j ACCEPT
      loop:
        - "8081"
        - "9090"
        - "9093"
      changed_when: true
      failed_when: false

    - name: DOCKER-USER NFLOG — tráfico no permitido
      ansible.builtin.command: >
        iptables -A DOCKER-USER
          -m comment --comment "docker-user-nflog-drop"
          -j NFLOG --nflog-group 4 --nflog-prefix "DOCKER-USER-DROP: " --nflog-threshold 1
      changed_when: true
      failed_when: false

    - name: DOCKER-USER DROP todo lo demás
      ansible.builtin.command: >
        iptables -A DOCKER-USER
          -j DROP
      changed_when: true
      failed_when: false

# ─────────────────────────────────────────────────────────────────────────────
# PLAY 10 — Cerrar INPUT con NFLOG+DROP, persistir y verificar
# ─────────────────────────────────────────────────────────────────────────────
- name: Cerrar INPUT con NFLOG+DROP, persistir y verificar (todos los nodos)
  hosts: all
  become: yes
  tasks:

    - name: INPUT NFLOG — tráfico no permitido (group 1)
      ansible.builtin.command: >
        iptables -A INPUT
          -m comment --comment "input-nflog-drop"
          -j NFLOG --nflog-group 1 --nflog-prefix "INPUT-DROP: " --nflog-threshold 1
      changed_when: true

    - name: INPUT DROP — tráfico no permitido (catch-all)
      ansible.builtin.iptables:
        chain: INPUT
        jump: DROP
        comment: input-default-drop

    - name: Guardar reglas IPv4 de forma persistente
      ansible.builtin.command: netfilter-persistent save
      changed_when: true

    - name: Verificar reglas INPUT
      ansible.builtin.command: iptables -L INPUT -n --line-numbers -v
      register: ipt_input
      changed_when: false

    - name: Mostrar reglas INPUT
      ansible.builtin.debug:
        msg: "{{ ipt_input.stdout_lines }}"

    - name: Verificar reglas FORWARD
      ansible.builtin.command: iptables -L FORWARD -n --line-numbers -v
      register: ipt_forward
      changed_when: false

    - name: Mostrar reglas FORWARD
      ansible.builtin.debug:
        msg: "{{ ipt_forward.stdout_lines }}"

    - name: Verificar reglas DOCKER-USER
      ansible.builtin.command: iptables -L DOCKER-USER -n --line-numbers
      register: du_check
      changed_when: false
      failed_when: false

    - name: Mostrar reglas DOCKER-USER
      ansible.builtin.debug:
        msg: "{{ du_check.stdout_lines | default(['cadena no existe aún — se creará al arrancar Docker']) }}"