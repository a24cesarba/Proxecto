---
- name: Configure SQL Server firewall
  hosts: database
  become: true

  vars:
    admin_ip: "ADMIN_IP_PLACEHOLDER"

  tasks:

    - name: Flush filter table
      ansible.builtin.shell: |
        iptables -F
        iptables -X
      args:
        executable: /bin/bash

    #################################################
    # POLICIES
    #################################################

    - name: INPUT ACCEPT
      ansible.builtin.iptables:
        chain: INPUT
        policy: ACCEPT

    - name: FORWARD ACCEPT
      ansible.builtin.iptables:
        chain: FORWARD
        policy: ACCEPT

    - name: OUTPUT ACCEPT
      ansible.builtin.iptables:
        chain: OUTPUT
        policy: ACCEPT

    #################################################
    # BASE
    #################################################

    - name: Allow loopback
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: lo
        jump: ACCEPT

    - name: Allow established
      ansible.builtin.iptables:
        chain: INPUT
        match: conntrack
        ctstate: ESTABLISHED,RELATED
        jump: ACCEPT

    - name: Allow ICMP
      ansible.builtin.iptables:
        chain: INPUT
        protocol: icmp
        jump: ACCEPT

    #################################################
    # SSH
    #################################################

    - name: Allow SSH only from admin IP
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: eth0
        protocol: tcp
        source: "{{ admin_ip }}"
        destination_port: 22
        jump: ACCEPT

    #################################################
    # PROVISIONING NETWORK
    #################################################

    - name: Allow HTTP to repositories only
      ansible.builtin.iptables:
        chain: OUTPUT
        out_interface: eth0
        protocol: tcp
        destination: "MICROSOFT_REPO_IP"
        destination_port: 80
        jump: ACCEPT

    - name: Allow HTTPS to repositories only
      ansible.builtin.iptables:
        chain: OUTPUT
        out_interface: eth0
        protocol: tcp
        destination: "MICROSOFT_REPO_IP"
        destination_port: 443
        jump: ACCEPT

    #################################################
    # SWARM
    #################################################

    - name: Swarm TCP discovery
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: eth1
        protocol: tcp
        destination_port: 7946
        jump: ACCEPT

    - name: Swarm UDP discovery
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: eth1
        protocol: udp
        destination_port: 7946
        jump: ACCEPT

    - name: VXLAN overlay
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: eth1
        protocol: udp
        destination_port: 4789
        jump: ACCEPT

    #################################################
    # SQL SERVER
    #################################################

    - name: SQL Server
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: eth2
        protocol: tcp
        destination_port: 1433
        jump: ACCEPT

    - name: SQL Server Browser
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: eth2
        protocol: udp
        destination_port: 1434
        jump: ACCEPT

    #################################################
    # MONITORING
    #################################################

    - name: Node exporter
      ansible.builtin.iptables:
        chain: INPUT
        in_interface: eth0
        protocol: tcp
        source: "{{ admin_ip }}"
        destination_port: 9100
        jump: ACCEPT

    #################################################
    # DOCKER
    #################################################

    - name: Docker bridge input
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: docker0
        jump: ACCEPT

    - name: Docker bridge output
      ansible.builtin.iptables:
        chain: FORWARD
        out_interface: docker0
        jump: ACCEPT

    - name: Docker gwbridge input
      ansible.builtin.iptables:
        chain: FORWARD
        in_interface: docker_gwbridge
        jump: ACCEPT

    - name: Docker gwbridge output
      ansible.builtin.iptables:
        chain: FORWARD
        out_interface: docker_gwbridge
        jump: ACCEPT

    #################################################
    # NFLOG + DROP
    #################################################

    - name: NFLOG remaining INPUT packets
      ansible.builtin.iptables:
        chain: INPUT
        jump: NFLOG

    - name: Drop remaining INPUT packets
      ansible.builtin.iptables:
        chain: INPUT
        jump: DROP