---
- name: Actualizar sistemas Debian e instalar Docker
  hosts: all
  become: yes

  tasks:

    - name: Actualizar cache de apt
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Instalar Docker
      apt:
        name: 
          - docker.io
          - python3-pip
        state: present

    - name: Asegurar que Docker esté iniciado y habilitado
      systemd:
        name: docker
        state: started
        enabled: yes

    - name: Añadir usuario actual al grupo docker
      user:
        name: "{{ ansible_user }}"
        groups: docker
        append: yes

    - name: Instalar iptables nflog
      apt:
        name:
          - iptables
          - iptables-persistent
          - ulogd2
        state: present