# =============================================================================
# prometheus.yml — configuración de scraping y alertas
# =============================================================================

global:
  scrape_interval:     15s
  evaluation_interval: 15s
  scrape_timeout:      10s

  external_labels:
    cluster: 'vagrant-swarm'
    environment: 'lab'

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"   # mismo stack: nombre corto es suficiente

scrape_configs:

  # ── cAdvisor (todos los nodos via Swarm SD) ─────────────────────────────
  - job_name: 'cadvisor'
    dockerswarm_sd_configs:
      - host: "tcp://socket-proxy:2375"    # FIX: ya no se usa el socket crudo
        role: tasks
        filters:
          - name: name
            values: ['app_cadvisor']
    relabel_configs:
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__address__]
        regex: '(.*):.*'
        replacement: '${1}:8080'
        target_label: __address__
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: job

  # ── Traefik métricas ─────────────────────────────────────────────────────
  - job_name: 'traefik'
    dockerswarm_sd_configs:
      - host: "tcp://socket-proxy:2375"    # FIX: misma corrección
        role: tasks
        filters:
          - name: name
            values: ['app_traefik']
    relabel_configs:
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__address__]
        regex: '(.*):.*'
        replacement: '${1}:8080'
        target_label: __address__
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Alertmanager self-monitoring ─────────────────────────────────────────
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']