# =============================================================================
# prometheus.yml — configuración de scraping y alertas
#
# Prometheus descubre los nodos via Docker Swarm SD (dockerswarm_sd_configs).
# Necesita acceso al Docker socket para listar las tasks del servicio cAdvisor.
# =============================================================================

global:
  scrape_interval:     15s   # frecuencia de scraping
  evaluation_interval: 15s   # frecuencia de evaluación de reglas
  scrape_timeout:      10s

  external_labels:
    cluster: 'vagrant-swarm'
    environment: 'lab'

# ── Reglas de alerta ──────────────────────────────────────────────────────────
rule_files:
  - /etc/prometheus/alert.rules.yml

# ── Alertmanager ──────────────────────────────────────────────────────────────
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "monitoring_alertmanager:9093"   # DNS Swarm del servicio

# ── Scrape configs ────────────────────────────────────────────────────────────
scrape_configs:

  # ── cAdvisor (todos los nodos via Swarm SD) ─────────────────────────────
  # dockerswarm_sd descubre las tasks activas del servicio cadvisor.
  # Los relabel_configs transforman los metadatos Swarm en labels Prometheus.
  - job_name: 'cadvisor'
    dockerswarm_sd_configs:
      - host: "unix:///var/run/docker.sock"
        role: tasks
        filters:
          - name: name
            values: ['monitoring_cadvisor']   # <stack>_<servicio>
    relabel_configs:
      # Solo tasks en estado running
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      # Puerto de scraping: cAdvisor en :8080
      - source_labels: [__address__]
        regex: '(.*):.*'
        replacement: '${1}:8080'
        target_label: __address__
      # Label con el nombre del nodo Swarm
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node
      # Label con el nombre del servicio
      - source_labels: [__meta_dockerswarm_service_name]
        target_label: job

  # ── Traefik métricas ─────────────────────────────────────────────────────
  # Traefik expone /metrics en su entrypoint interno :8080
  - job_name: 'traefik'
    dockerswarm_sd_configs:
      - host: "unix:///var/run/docker.sock"
        role: tasks
        filters:
          - name: name
            values: ['app_traefik']    # stack app, servicio traefik
    relabel_configs:
      - source_labels: [__meta_dockerswarm_task_desired_state]
        regex: running
        action: keep
      - source_labels: [__address__]
        regex: '(.*):.*'
        replacement: '${1}:8080'
        target_label: __address__
      - source_labels: [__meta_dockerswarm_node_hostname]
        target_label: node

  # ── Prometheus self-monitoring ───────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ── Alertmanager self-monitoring ─────────────────────────────────────────
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['monitoring_alertmanager:9093']
