global
    log         /dev/log local0
    log         /dev/log local1 notice
    maxconn     4096
    user        haproxy
    group       haproxy
    daemon

    # Stats socket — useful for runtime API (drain, enable, weight changes)
    stats socket /var/run/haproxy/admin.sock mode 0660 level admin expose-fd listeners
    stats timeout 30s

defaults
    log         global
    mode        tcp            # Layer 4 — pass raw MySQL protocol through
    option      tcplog
    option      dontlognull
    option      tcp-check
    retries     3
    timeout connect 5s
    timeout client  50s
    timeout server  50s

# ---------------------------------------------------------------------------
# Stats page — accessible from backend network only
# Reach it via:  curl http://<lb-node>:8080/stats
# ---------------------------------------------------------------------------
listen stats
    bind        *:8080
    mode        http
    stats       enable
    stats       uri /stats
    stats       refresh 5s
    stats       show-legends
    stats       show-node
    stats       auth admin:haproxy_stats   # change in production

# ---------------------------------------------------------------------------
# Frontend — accepts connections from web containers on the web_lb network
# Web containers connect to the lb service name (app_lb) on port 3306.
# ---------------------------------------------------------------------------
frontend mysql_front
    bind        *:3306
    default_backend galera_nodes

# ---------------------------------------------------------------------------
# Backend — Galera cluster, round-robin across all 3 nodes.
# Uses Swarm DNS service name (app_db) which resolves to all db task IPs
# via dnsrr. Each server line maps to an individual Galera node resolved
# at runtime; names are logical — HAProxy re-resolves DNS on startup.
#
# check: basic TCP connect check (port 3306)
# inter: check every 2s
# rise/fall: 2 consecutive successes to mark UP, 3 failures to mark DOWN
# ---------------------------------------------------------------------------
backend galera_nodes
    balance     roundrobin
    option      tcp-check

    # Checks that MariaDB responds to a TCP connection on 3306
    tcp-check   connect
    tcp-check   expect string 5.   # MariaDB handshake starts with protocol ver

    # Swarm resolves app_db to individual task IPs via dnsrr.
    # resolvers docker uses Swarm's internal DNS (127.0.0.11).
    default-server inter 2s fall 3 rise 2 on-marked-down shutdown-sessions

    server-template galera 1-3 app_db:3306 check resolvers docker resolve-prefer ipv4

# ---------------------------------------------------------------------------
# Resolver — use Swarm's embedded DNS so HAProxy can resolve service names
# ---------------------------------------------------------------------------
resolvers docker
    nameserver dns1 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry   1s
    hold valid 10s
