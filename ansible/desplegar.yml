---
- name: Crear secretos, configuraciones y desplegar stack
  hosts: web1
  become: yes

  vars_prompt:

    - name: db_root_password
      prompt: |

        ============================================================
        Contraseña root de MariaDB
        (se usará para crear el secreto Docker 'db_root_password')
      private: yes
      confirm: yes

    - name: db_galera_password
      prompt: |

        Contraseña SST de Galera
        (se usará para crear el secreto Docker 'db_galera_password')
      private: yes
      confirm: yes

    - name: db_app_password
      prompt: |

        Contraseña del usuario de aplicación en MariaDB
        (se usará para crear el secreto Docker 'db_app_password')
        Usuario que se creará: app  /  Base de datos: app
      private: yes
      confirm: yes

  tasks:

    # ── Secretos ──────────────────────────────────────────────────────────────

    - name: Comprobar si el secreto db_root_password ya existe
      ansible.builtin.command: docker secret inspect db_root_password
      register: secret_root_check
      changed_when: false
      failed_when: false

    - name: Crear secreto db_root_password
      ansible.builtin.shell: "printf '%s' '{{ db_root_password }}' | docker secret create db_root_password -"
      when: secret_root_check.rc != 0
      no_log: true

    - name: Comprobar si el secreto db_galera_password ya existe
      ansible.builtin.command: docker secret inspect db_galera_password
      register: secret_galera_check
      changed_when: false
      failed_when: false

    - name: Crear secreto db_galera_password
      ansible.builtin.shell: "printf '%s' '{{ db_galera_password }}' | docker secret create db_galera_password -"
      when: secret_galera_check.rc != 0
      no_log: true

    - name: Comprobar si el secreto db_app_password ya existe
      ansible.builtin.command: docker secret inspect db_app_password
      register: secret_app_check
      changed_when: false
      failed_when: false

    - name: Crear secreto db_app_password
      ansible.builtin.shell: "printf '%s' '{{ db_app_password }}' | docker secret create db_app_password -"
      when: secret_app_check.rc != 0
      no_log: true

    # ── Config de HAProxy ─────────────────────────────────────────────────────

    - name: Copiar haproxy.cfg al nodo leader
      ansible.builtin.copy:
        src: ./haproxy.cfg
        dest: /tmp/haproxy.cfg
        mode: '0644'

    - name: Comprobar si el config haproxy_cfg ya existe
      ansible.builtin.command: docker config inspect haproxy_cfg
      register: config_haproxy_check
      changed_when: false
      failed_when: false

    - name: Crear config haproxy_cfg
      ansible.builtin.command: docker config create haproxy_cfg /tmp/haproxy.cfg
      when: config_haproxy_check.rc != 0

    - name: Advertir si haproxy_cfg ya existe
      ansible.builtin.debug:
        msg: >
          AVISO: el config 'haproxy_cfg' ya existe en el clúster.
          Si modificaste haproxy.cfg, rota el config manualmente:
            docker config create haproxy_cfg_v2 /tmp/haproxy.cfg
            docker service update --config-rm haproxy_cfg
              --config-add source=haproxy_cfg_v2,target=/usr/local/etc/haproxy/haproxy.cfg
              app_lb
      when: config_haproxy_check.rc == 0

    # ── Config de Traefik ─────────────────────────────────────────────────────

    - name: Copiar traefik.yml al nodo leader
      ansible.builtin.copy:
        src: ./traefik/traefik.yml
        dest: /tmp/traefik.yml
        mode: '0644'

    - name: Comprobar si el config traefik_cfg ya existe
      ansible.builtin.command: docker config inspect traefik_cfg
      register: config_traefik_check
      changed_when: false
      failed_when: false

    - name: Crear config traefik_cfg
      ansible.builtin.command: docker config create traefik_cfg /tmp/traefik.yml
      when: config_traefik_check.rc != 0

    - name: Advertir si traefik_cfg ya existe
      ansible.builtin.debug:
        msg: >
          AVISO: el config 'traefik_cfg' ya existe en el clúster.
          Si modificaste traefik.yml, rota el config manualmente:
            docker config create traefik_cfg_v2 /tmp/traefik.yml
            docker service update --config-rm traefik_cfg
              --config-add source=traefik_cfg_v2,target=/etc/traefik/traefik.yml
              app_traefik
      when: config_traefik_check.rc == 0

    # ── Config de Prometheus ──────────────────────────────────────────────────
    - name: Copiar prometheus.yml al nodo leader
      ansible.builtin.copy:
        src: ./prometheus/prometheus.yml
        dest: /tmp/prometheus.yml
        mode: '0644'

    - name: Comprobar si prometheus_cfg ya existe
      ansible.builtin.command: docker config inspect prometheus_cfg
      register: config_prometheus_check
      changed_when: false
      failed_when: false

    - name: Crear config prometheus_cfg
      ansible.builtin.command: docker config create prometheus_cfg /tmp/prometheus.yml
      when: config_prometheus_check.rc != 0

    - name: Advertir si prometheus_cfg ya existe
      ansible.builtin.debug:
        msg: >
          AVISO: el config 'prometheus_cfg' ya existe. Si modificaste prometheus.yml,
          rota el config manualmente:
            docker config create prometheus_cfg_v2 /tmp/prometheus.yml
            docker service update --config-rm prometheus_cfg
              --config-add source=prometheus_cfg_v2,target=/etc/prometheus/prometheus.yml
              app_prometheus
      when: config_prometheus_check.rc == 0

    # ── Config de Alertmanager ────────────────────────────────────────────────
    - name: Copiar alertmanager.yml al nodo leader
      ansible.builtin.copy:
        src: ./alertmanager/alertmanager.yml
        dest: /tmp/alertmanager.yml
        mode: '0644'

    - name: Comprobar si alertmanager_cfg ya existe
      ansible.builtin.command: docker config inspect alertmanager_cfg
      register: config_alertmanager_check
      changed_when: false
      failed_when: false

    - name: Crear config alertmanager_cfg
      ansible.builtin.command: docker config create alertmanager_cfg /tmp/alertmanager.yml
      when: config_alertmanager_check.rc != 0

    - name: Advertir si alertmanager_cfg ya existe
      ansible.builtin.debug:
        msg: >
          AVISO: el config 'alertmanager_cfg' ya existe. Si modificaste alertmanager.yml,
          rota el config manualmente:
            docker config create alertmanager_cfg_v2 /tmp/alertmanager.yml
            docker service update --config-rm alertmanager_cfg
              --config-add source=alertmanager_cfg_v2,target=/etc/alertmanager/alertmanager.yml
              app_alertmanager
      when: config_alertmanager_check.rc == 0

    # ── Config de reglas de alerta ────────────────────────────────────────────
    - name: Copiar alert.rules.yml al nodo leader
      ansible.builtin.copy:
        src: ./alertmanager/alert.rules.yml
        dest: /tmp/alert.rules.yml
        mode: '0644'

    - name: Comprobar si alert_rules_cfg ya existe
      ansible.builtin.command: docker config inspect alert_rules_cfg
      register: config_alertrules_check
      changed_when: false
      failed_when: false

    - name: Crear config alert_rules_cfg
      ansible.builtin.command: docker config create alert_rules_cfg /tmp/alert.rules.yml
      when: config_alertrules_check.rc != 0

    - name: Advertir si alert_rules_cfg ya existe
      ansible.builtin.debug:
        msg: >
          AVISO: el config 'alert_rules_cfg' ya existe. Si modificaste alert.rules.yml,
          rota el config manualmente:
            docker config create alert_rules_cfg_v2 /tmp/alert.rules.yml
            docker service update
              --config-rm alert_rules_cfg
              --config-add source=alert_rules_cfg_v2,target=/etc/prometheus/alert.rules.yml
              app_prometheus
      when: config_alertrules_check.rc == 0

    # ── Stack file ────────────────────────────────────────────────────────────

    - name: Crear directorio para ficheros del stack en el leader
      ansible.builtin.file:
        path: /opt/swarm-stack
        state: directory
        mode: '0755'

    - name: Copiar docker-stack.yml al leader
      ansible.builtin.copy:
        src: ./docker-stack.yml
        dest: /opt/swarm-stack/docker-stack.yml
        mode: '0644'

    # ── Despliegue ────────────────────────────────────────────────────────────

    - name: Desplegar stack 'app'
      ansible.builtin.command:
        cmd: docker stack deploy -c /opt/swarm-stack/docker-stack.yml app
      register: stack_result
      changed_when: >
        'Creating' in stack_result.stdout or
        'Updating' in stack_result.stdout

    - name: Resultado del despliegue
      ansible.builtin.debug:
        msg: "{{ stack_result.stdout_lines }}"

    - name: Esperar 60 segundos a que los servicios inicialicen
      ansible.builtin.pause:
        seconds: 60

    - name: Mostrar estado de los servicios del stack
      ansible.builtin.command: >
        docker stack services app
        --format "table {{"{{"}} .Name {{"}}"}}\t{{"{{"}} .Mode {{"}}"}}\t{{"{{"}} .Replicas {{"}}"}}\t{{"{{"}} .Image {{"}}"}}"
      register: services_status
      changed_when: false

    - name: Estado final
      ansible.builtin.debug:
        msg: "{{ services_status.stdout_lines }}"
        