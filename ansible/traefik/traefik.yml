api:
  dashboard: true
  insecure: true    # dashboard en :8080 — ok en red interna

entryPoints:
  web:
    address: ":80"
    # Para redirigir HTTP → HTTPS en producción:
    # http:
    #   redirections:
    #     entryPoint:
    #       to: websecure
    #       scheme: https

  websecure:
    address: ":443"

providers:
  docker:
    # FIX: nombre completo del servicio para resolución DNS cross-stack,
    # y sin bloque tls (el socket-proxy usa HTTP plano, no HTTPS).
    endpoint: "tcp://monitoring_socket-proxy:2375"

    swarmMode: true
    swarmModeRefreshSeconds: 15
    exposedByDefault: false
    network: app_proxy_web

log:
  level: "INFO"

accessLog:
  bufferingSize: 100

metrics:
  prometheus:
    addEntryPointsLabels: true
    addServicesLabels: true
    entryPoint: traefik
