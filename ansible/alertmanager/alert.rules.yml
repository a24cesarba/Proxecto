groups:

  - name: web_autoscale
    interval: 30s

    rules:

      # ── Scale UP ───────────────────────────────────────────────────────────
      - alert: WebHighCpu
        expr: |
          avg(
            rate(
              container_cpu_usage_seconds_total{
                container_label_com_docker_swarm_service_name="app_web",
                id!="/"
              }[2m]
            )
          ) by (container_label_com_docker_swarm_service_name)
          > 0.70
        for: 2m
        labels:
          severity: warning
          action: scale_up
          service: app_web
        annotations:
          summary: "CPU alta en servicio web — escalar hacia arriba"
          description: >
            El uso medio de CPU del servicio app_web lleva más de 2 minutos
            por encima del 70%.

      # ── Scale DOWN ─────────────────────────────────────────────────────────
      - alert: WebLowCpu
        expr: |
          avg(
            rate(
              container_cpu_usage_seconds_total{
                container_label_com_docker_swarm_service_name="app_web",
                id!="/"
              }[5m]
            )
          ) by (container_label_com_docker_swarm_service_name)
          < 0.20
        for: 5m
        labels:
          severity: info
          action: scale_down
          service: app_web
        annotations:
          summary: "CPU baja en servicio web — escalar hacia abajo"
          description: >
            El uso medio de CPU del servicio app_web lleva más de 5 minutos
            por debajo del 20%.

      - alert: GaleraNodeDown
        expr: |
          count(
            container_last_seen{
              container_label_com_docker_swarm_service_name="app_db",
              id!="/"
            }
          ) < 3
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Nodo Galera caído — clúster en riesgo de pérdida de quórum"
          description: >
            Solo {{ $value }} contenedores Galera están activos según cAdvisor.
            El mínimo para mantener quórum es 3. Revisar el estado del stack app.