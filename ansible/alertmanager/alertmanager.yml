# =============================================================================
# alertmanager.yml — routing de alertas
#
# Las alertas de autoescalado van al webhook del autoscaler.
# =============================================================================

global:
  resolve_timeout: 5m

# ── Inhibit rules ─────────────────────────────────────────────────────────────
inhibit_rules:
  - source_matchers:
      - 'alertname = "WebHighCpu"'
    target_matchers:
      - 'alertname = "WebLowCpu"'
    equal: ['service']

# ── Route tree ────────────────────────────────────────────────────────────────
route:
  receiver: 'null'      
  group_by: ['alertname', 'service']
  group_wait:      30s  
  group_interval:  5m   
  repeat_interval: 1h 

  routes:

    # ── Alertas de autoescalado → autoscaler webhook ─────────────────────
    - receiver: 'autoscaler-webhook'
      matchers:
        - 'action =~ "scale_up|scale_down"'
      group_wait:      10s  
      group_interval:  60s
      repeat_interval: 2m   


# ── Receivers ─────────────────────────────────────────────────────────────────
receivers:

  - name: 'null'  

  - name: 'autoscaler-webhook'
    webhook_configs:
      - url: 'http://app_autoscaler:5000/webhook'
        send_resolved: true  

