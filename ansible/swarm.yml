---
- name: Configurar Clúster Docker Swarm Completo
  hosts: all
  become: yes
  vars:
    swarm_leader_ip: "10.0.0.11"
    leader_hostname: "web1"

  tasks:

    - name: Verificar el estado actual de Docker Swarm en todos los nodos
      ansible.builtin.shell: docker info | grep "Swarm:"
      register: swarm_check
      changed_when: false

    # --- TAREAS DEL LÍDER ---

    - name: Inicializar Docker Swarm en el Líder
      ansible.builtin.command: "docker swarm init --advertise-addr {{ swarm_leader_ip }}"
      when:
        - inventory_hostname == leader_hostname
        - "'Swarm: inactive' in swarm_check.stdout"

    - name: Obtener token de unión para Managers
      ansible.builtin.command: docker swarm join-token -q manager
      register: manager_token_raw
      when: inventory_hostname == leader_hostname
      changed_when: false

    - name: Obtener token de unión para Workers
      ansible.builtin.command: docker swarm join-token -q worker
      register: worker_token_raw
      when: inventory_hostname == leader_hostname
      changed_when: false

    # --- TAREAS DE MANAGERS SECUNDARIOS ---

    - name: Unir web2 y web3 al clúster como Managers
      ansible.builtin.command: >
        docker swarm join
        --token {{ hostvars[leader_hostname]['manager_token_raw']['stdout'] }}
        {{ swarm_leader_ip }}:2377
      when:
        - inventory_hostname in groups['webs']
        - inventory_hostname != leader_hostname
        - "'Swarm: inactive' in swarm_check.stdout"

    # --- TAREAS DE WORKERS ---

    - name: Unir nodos al clúster como Workers
      ansible.builtin.command: >
        docker swarm join
        --token {{ hostvars[leader_hostname]['worker_token_raw']['stdout'] }}
        {{ swarm_leader_ip }}:2377
      when:
        - inventory_hostname in groups['workers']
        - "'Swarm: inactive' in swarm_check.stdout"

    # --- ETIQUETAS DE NODOS ---

    - name: Etiquetar nodos balanceadores (role=lb)
      ansible.builtin.command: "docker node update --label-add role=lb {{ item }}"
      loop: "{{ groups['balanceadores'] }}"
      when: inventory_hostname == leader_hostname
      changed_when: false

    - name: Etiquetar nodos de base de datos (role=db)
      ansible.builtin.command: "docker node update --label-add role=db {{ item }}"
      loop: "{{ groups['bases'] }}"
      when: inventory_hostname == leader_hostname
      changed_when: false

    # db1 es el nodo que arranca el cluster Galera en el primer despliegue.
    # El entrypoint de la imagen Galera comprueba esta etiqueta para decidir
    # si lanzar --wsrep-new-cluster o hacer join.
    - name: Etiquetar db1 como nodo bootstrap de Galera
      ansible.builtin.command: "docker node update --label-add galera.bootstrap=true db1"
      when: inventory_hostname == leader_hostname
      changed_when: false


# Configuración de redes locales para poder usar macvlan en swarm

    - name: Crear configuracion de red local para Frontend
      docker_network:
        name: frontend_config
        driver: macvlan
        config_only: true
        ipam_config:
          - subnet: 192.168.56.0/24
        driver_options:
          parent: eth2
      when: inventory_hostname in groups['webs']

    - name: Crear configuracion de red local para Web-LB (Webs y LBs)
      docker_network:
        name: web_lb_config
        driver: macvlan
        config_only: true
        ipam_config:
          - subnet: 10.10.0.0/24
        driver_options:
          # Usa eth3 si es un nodo web, eth2 si es un balanceador
          parent: "{{ 'eth3' if inventory_hostname in groups['webs'] else 'eth2' }}"
      when: inventory_hostname in groups['webs'] or inventory_hostname in groups['balanceadores']

    - name: Crear configuracion de red local para Backend (LBs y Bases de Datos)
      docker_network:
        name: backend_config
        driver: macvlan
        config_only: true
        ipam_config:
          - subnet: 10.10.10.0/24
        driver_options:
          # Usa eth3 si es un balanceador, eth2 si es base de datos
          parent: "{{ 'eth3' if inventory_hostname in groups['balanceadores'] else 'eth2' }}"
      when: inventory_hostname in groups['balanceadores'] or inventory_hostname in groups['bases']

# Creación de redes macvlan swarm desde web1(el jefe)

    - name: Crear red Swarm Macvlan - Frontend
      ansible.builtin.command: >
        docker network create -d macvlan --scope swarm
        --config-from frontend_config frontend
      when: inventory_hostname == leader_hostname
      register: net_frontend
      failed_when: 
        - net_frontend.rc != 0
        - "'already exists' not in net_frontend.stderr"
      changed_when: net_frontend.rc == 0

    - name: Crear red Swarm Macvlan - Web-LB
      ansible.builtin.command: >
        docker network create -d macvlan --scope swarm
        --config-from web_lb_config web_lb
      when: inventory_hostname == leader_hostname
      register: net_weblb
      failed_when: 
        - net_weblb.rc != 0
        - "'already exists' not in net_weblb.stderr"
      changed_when: net_weblb.rc == 0

    - name: Crear red Swarm Macvlan - Backend
      ansible.builtin.command: >
        docker network create -d macvlan --scope swarm
        --config-from backend_config backend
      when: inventory_hostname == leader_hostname
      register: net_backend
      failed_when: 
        - net_backend.rc != 0
        - "'already exists' not in net_backend.stderr"
      changed_when: net_backend.rc == 0


    # Verificación final: muestra el estado del clúster y las etiquetas aplicadas.
    # Útil para confirmar que todo quedó bien antes de desplegar el stack.
    - name: Mostrar estado del clúster y etiquetas
      ansible.builtin.command: >
        docker node ls --format
        "table {{"{{"}}  .Hostname{{"}}"}}\t{{"{{"}} .Status {{"}}"}}\t{{"{{"}} .ManagerStatus {{"}}"}}\t{{"{{"}} .Availability {{"}}"}}"
      register: swarm_status
      when: inventory_hostname == leader_hostname
      changed_when: false

    - name: Resultado
      ansible.builtin.debug:
        msg: "{{ swarm_status.stdout_lines }}"
      when: inventory_hostname == leader_hostname