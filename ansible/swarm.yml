---
- name: Configurar Clúster Docker Swarm Completo
  hosts: all
  become: yes
  vars:
    swarm_leader_ip: "10.0.0.11"
    swarm_leader_data_ip: "10.10.0.11"   # fix: antes 'swarm_data_leader_ip' (typo)
    leader_hostname: "web1"
    mgmt_ip: "{{ ansible_facts['eth1']['ipv4']['address'] }}"
    data_ip: "{{ ansible_facts['eth2']['ipv4']['address'] }}"

  tasks:

    - name: Verificar el estado actual de Docker Swarm en todos los nodos
      ansible.builtin.shell: docker info | grep "Swarm:"
      register: swarm_check
      changed_when: false

    # ── LÍDER ────────────────────────────────────────────────────────────────

    - name: Inicializar Docker Swarm en el Líder
      ansible.builtin.command: >
        docker swarm init
          --advertise-addr {{ swarm_leader_ip }}
          --data-path-addr {{ swarm_leader_data_ip }}
      when:
        - inventory_hostname == leader_hostname
        - "'Swarm: inactive' in swarm_check.stdout"

    - name: Obtener token de unión para Managers
      ansible.builtin.command: docker swarm join-token -q manager
      register: manager_token_raw
      when: inventory_hostname == leader_hostname
      changed_when: false

    - name: Obtener token de unión para Workers
      ansible.builtin.command: docker swarm join-token -q worker
      register: worker_token_raw
      when: inventory_hostname == leader_hostname
      changed_when: false

    # ── MANAGERS SECUNDARIOS (web2, web3) ─────────────────────────────────

    - name: Unir web2 y web3 como Managers
      ansible.builtin.command: >
        docker swarm join
          --token {{ hostvars[leader_hostname]['manager_token_raw']['stdout'] }}
          --advertise-addr {{ mgmt_ip }}
          --data-path-addr {{ data_ip }}
          {{ swarm_leader_ip }}:2377
      when:
        - inventory_hostname in groups['webs']
        - inventory_hostname != leader_hostname
        - "'Swarm: inactive' in swarm_check.stdout"


    - name: Unir nodos al clúster como Workers
      ansible.builtin.command: >
        docker swarm join
          --token {{ hostvars[leader_hostname]['worker_token_raw']['stdout'] }}
          --advertise-addr {{ mgmt_ip }}
          --data-path-addr {{ data_ip }}
          {{ swarm_leader_ip }}:2377
      when:
        - inventory_hostname in groups['workers']
        - "'Swarm: inactive' in swarm_check.stdout"

    # ── ETIQUETAS ─────────────────────────────────────────────────────────

    - name: Etiquetar nodos balanceadores MySQL (role=lb)
      ansible.builtin.command: "docker node update --label-add role=lb {{ item }}"
      loop: "{{ groups['balanceadores'] }}"
      when: inventory_hostname == leader_hostname
      changed_when: false

    - name: Etiquetar nodos de base de datos (role=db)
      ansible.builtin.command: "docker node update --label-add role=db {{ item }}"
      loop: "{{ groups['bases'] }}"
      when: inventory_hostname == leader_hostname
      changed_when: false

    - name: Etiquetar nodos Traefik (role=traefik)
      ansible.builtin.command: "docker node update --label-add role=traefik {{ item }}"
      loop: "{{ groups['traefik'] }}"
      when: inventory_hostname == leader_hostname
      changed_when: false

    - name: Etiquetar db1 como nodo bootstrap de Galera
      ansible.builtin.command: "docker node update --label-add galera.bootstrap=true db1"
      when: inventory_hostname == leader_hostname
      changed_when: false

    # ── VERIFICACIÓN FINAL ────────────────────────────────────────────────

    - name: Mostrar estado del clúster y etiquetas
      ansible.builtin.command: >
        docker node ls --format
        "table {{"{{"}} .Hostname {{"}}"}}\t{{"{{"}} .Status {{"}}"}}\t{{"{{"}} .ManagerStatus {{"}}"}}\t{{"{{"}} .Availability {{"}}"}}"
      register: swarm_status
      when: inventory_hostname == leader_hostname
      changed_when: false

    - name: Resultado
      ansible.builtin.debug:
        msg: "{{ swarm_status.stdout_lines }}"
      when: inventory_hostname == leader_hostname
