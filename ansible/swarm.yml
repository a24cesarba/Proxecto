- name: Inicializar Docker Swarm
  hosts: manager
  become: yes

  tasks:

    - name: Inicializar swarm
      shell: |
        docker swarm init --advertise-addr {{ ansible_host }}
      register: swarm_init
      failed_when: false

    - name: Obtener token worker
      shell: docker swarm join-token -q worker
      register: worker_token

    - name: Guardar token global
      set_fact:
        swarm_worker_token: "{{ worker_token.stdout }}"

# ============================================
# Añadir workers al cluster
# ============================================

- name: Unir workers al swarm
  hosts: workers
  become: yes

  tasks:

    - name: Join swarm cluster
      shell: |
        docker swarm join \
        --token {{ hostvars['nodo1']['swarm_worker_token'] }} \
        {{ hostvars['nodo1']['ansible_host'] }}:2377
      failed_when: false

# ============================================
# Etiquetar nodos
# ============================================

- name: Etiquetar nodos swarm
  hosts: manager
  become: yes

  tasks:

    - name: Label manager
      shell: docker node update --label-add role=manager-services nodo1

    - name: Label web nodes
      shell: docker node update --label-add role=web {{ item }}
      loop:
        - nodo2
        - nodo3
        - nodo4

    - name: Label database node
      shell: docker node update --label-add role=db nodo5